<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>NotebookLM 桌面版</title>
    <style>
      :root {
        --bg: rgba(252, 252, 254, 0.60);
        --titlebar-grad-a: rgba(255, 255, 255, 0.52);
        --titlebar-grad-b: rgba(255, 255, 255, 0.32);
        --footer-grad-a: rgba(255, 255, 255, 0.46);
        --footer-grad-b: rgba(255, 255, 255, 0.30);
        --footer-border: rgba(0, 0, 0, 0.06);
        --glass-border: rgba(0, 0, 0, 0.10);
        --glass-highlight: rgba(255, 255, 255, 0.60);
        --glass-blur: blur(28px) saturate(170%);
        --glass-radius: 14px;
        --text-on-purple: #232733; /* chrome text (name kept for compat) */
        --text-muted: #6b7280;
        --link: #4b5563;
        --link-hover: #111827;
        --divider: rgba(0, 0, 0, 0.08);
        --close-hover: #e81123;
        --btn-bg: rgba(0, 0, 0, 0.05);
        --btn-bg-hover: rgba(0, 0, 0, 0.10);
        --btn-bg-active: rgba(0, 0, 0, 0.16);
        --btn-primary-bg: rgba(35, 39, 51, 0.92);
        --btn-primary-fg: #ffffff;
        --sheen-color: rgba(255, 255, 255, 0.75);
        --recording-bg: rgba(0, 0, 0, 0.07);
        --modal-bg: rgba(255, 255, 255, 0.86);
        --modal-fg: #1a1a1a;
        --modal-border: rgba(0, 0, 0, 0.10);
        --error-bg: rgba(255, 255, 255, 0.90);
        --error-fg: #1a1a1a;
      }
      [data-theme="dark"] {
        --bg: rgba(17, 17, 22, 0.62);
        --titlebar-grad-a: rgba(32, 32, 40, 0.60);
        --titlebar-grad-b: rgba(20, 20, 28, 0.44);
        --footer-grad-a: rgba(26, 26, 34, 0.56);
        --footer-grad-b: rgba(18, 18, 26, 0.42);
        --footer-border: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.14);
        --glass-highlight: rgba(255, 255, 255, 0.20);
        --glass-blur: blur(28px) saturate(170%);
        --glass-radius: 14px;
        --text-on-purple: #f2f2f7;
        --text-muted: #9ca3af;
        --link: #c7c9d1;
        --link-hover: #ffffff;
        --divider: rgba(255, 255, 255, 0.10);
        --close-hover: #c11020;
        --btn-bg: rgba(255, 255, 255, 0.08);
        --btn-bg-hover: rgba(255, 255, 255, 0.16);
        --btn-bg-active: rgba(255, 255, 255, 0.26);
        --btn-primary-bg: rgba(255, 255, 255, 0.92);
        --btn-primary-fg: #16181f;
        --sheen-color: rgba(255, 255, 255, 0.30);
        --recording-bg: rgba(255, 255, 255, 0.12);
        --modal-bg: rgba(24, 24, 32, 0.90);
        --modal-fg: #f2f2f7;
        --modal-border: rgba(255, 255, 255, 0.12);
        --error-bg: rgba(24, 24, 32, 0.92);
        --error-fg: #f2f2f7;
      }
      html, body { background: transparent; }
      body {
        margin: 0; padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: flex; flex-direction: column;
        height: 100vh; overflow: hidden;
        border-radius: var(--glass-radius);
        box-shadow: inset 0 0 0 1px var(--glass-border),
                    inset 0 1px 0 var(--glass-highlight),
                    inset 0 -1px 0 rgba(255, 255, 255, 0.10);
      }
      body.maximized { border-radius: 0; }
      #titlebar {
        height: 36px;
        background: linear-gradient(90deg, var(--titlebar-grad-a), var(--titlebar-grad-b));
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        color: var(--text-on-purple);
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 1px solid var(--glass-border);
        box-shadow: inset 0 1px 0 var(--glass-highlight);
        -webkit-app-region: drag; user-select: none;
      }
      #titlebar-left { display: flex; align-items: center; padding-left: 10px; gap: 10px; }
      #titlebar-title { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
      #titlebar-middle { display: flex; align-items: center; gap: 12px; -webkit-app-region: no-drag; }
      .control-group { display: flex; align-items: center; gap: 5px; font-size: 12px; }
      #opacity-slider { width: 80px; accent-color: currentColor; cursor: pointer; }
      .tbtn {
        position: relative; overflow: hidden;
        background: var(--btn-bg);
        border: 1px solid var(--glass-border);
        color: var(--text-on-purple);
        padding: 3px 11px; border-radius: 999px; cursor: pointer;
        font-size: 11px; font-weight: bold;
        box-shadow: inset 0 1px 0 var(--glass-highlight);
        transition: background 0.25s, box-shadow 0.25s, transform 0.15s;
      }
      .tbtn::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(115deg, transparent 32%, var(--sheen-color) 50%, transparent 68%);
        transform: translateX(-130%);
        transition: transform 0.55s ease;
      }
      .tbtn:hover { background: var(--btn-bg-hover); transform: translateY(-1px); }
      .tbtn:hover::after { transform: translateX(130%); }
      .tbtn:active { transform: translateY(0); }
      .tbtn.active { background: var(--btn-bg-active); box-shadow: inset 0 1px 0 var(--glass-highlight), 0 0 12px var(--glass-highlight); }
      #titlebar-right { display: flex; -webkit-app-region: no-drag; height: 100%; }
      .win-btn {
        width: 40px; background: transparent; border: none;
        color: var(--text-on-purple); font-size: 14px; cursor: pointer; transition: background 0.2s;
      }
      .win-btn:hover { background: var(--btn-bg-hover); }
      #close-btn:hover { background: var(--close-hover); }

      #app-container { flex: 1; display: flex; transition: all 0.3s ease; }
      .view-container {
        flex: 1; display: flex; flex-direction: column;
        border-right: 1px solid var(--divider); position: relative; min-width: 0;
      }
      .view-container:last-child { border-right: none; }
      .view-container.hidden { display: none; }
      webview { flex: 1; width: 100%; height: 100%; }

      .error-overlay {
        position: absolute; inset: 0;
        background: var(--error-bg); color: var(--error-fg);
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        display: none; align-items: center; justify-content: center;
        flex-direction: column; gap: 12px; padding: 20px; text-align: center; z-index: 5;
      }
      .error-overlay.show { display: flex; }
      .error-overlay .err-title { font-size: 16px; font-weight: 600; }
      .error-overlay .err-body { font-size: 13px; opacity: 0.8; max-width: 360px; }
      .error-overlay .err-actions { display: flex; gap: 8px; }
      .error-overlay button {
        padding: 6px 14px; border-radius: 4px; border: 1px solid var(--modal-border);
        background: var(--btn-bg); color: var(--modal-fg); cursor: pointer; font-size: 12px;
      }
      .error-overlay button.primary {
        background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-primary-bg);
      }

      footer {
        height: 36px;
        background: linear-gradient(90deg, var(--footer-grad-a), var(--footer-grad-b));
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border-top: 1px solid var(--glass-border);
        box-shadow: inset 0 1px 0 var(--glass-highlight);
        padding: 0 15px; display: flex; align-items: center; justify-content: flex-start;
        font-size: 13px; color: var(--text-muted); user-select: none; position: relative;
      }
      .footer-side-left { display: flex; align-items: center; }

      /* Settings modal */
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.35);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: none; align-items: center; justify-content: center; z-index: 1000;
      }
      .modal-backdrop.show { display: flex; }
      .modal {
        background: var(--modal-bg); color: var(--modal-fg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border); border-radius: 16px;
        width: 480px; max-width: 92vw; padding: 20px;
        box-shadow: inset 0 1px 0 var(--glass-highlight), 0 18px 56px rgba(0,0,0,0.45);
      }
      .modal h2 { margin: 0 0 14px; font-size: 16px; }
      .modal .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; gap: 12px; }
      .modal .row label { font-size: 13px; }
      .modal select, .modal input[type="text"] {
        background: transparent; color: var(--modal-fg);
        border: 1px solid var(--modal-border); border-radius: 4px;
        padding: 4px 8px; font-size: 13px; min-width: 160px;
      }
      .modal .footer-row { margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px; }
      .modal .footer-row button {
        padding: 6px 14px; border-radius: 4px; border: 1px solid var(--modal-border);
        background: transparent; color: var(--modal-fg); cursor: pointer; font-size: 12px;
      }
      .modal .footer-row button.primary {
        background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-primary-bg);
      }
      .hotkey-capture { font-family: monospace; min-width: 200px; text-align: center; }
      .hotkey-capture.recording { background: var(--recording-bg); }
      .status-msg { font-size: 11px; opacity: 0.7; margin-top: 4px; min-height: 14px; }
    </style>
  </head>
  <body data-theme="light">
    <div id="titlebar">
      <div id="titlebar-left">
        <span id="titlebar-title">NotebookLM 桌面版</span>
      </div>
      <div id="titlebar-middle">
        <label class="control-group" title="幽灵模式（窗口透明度）">
          透明度
          <input type="range" id="opacity-slider" min="0.2" max="1.0" step="0.05" value="1.0">
        </label>
        <button id="pane-toggle" class="tbtn" title="切换 1 / 2 / 3 窗格">窗格：1</button>
        <button id="pin-toggle" class="tbtn" title="窗口置顶">📌 置顶</button>
        <button id="theme-toggle" class="tbtn" title="切换主题">🌙</button>
        <button id="export-btn" class="tbtn" title="导出笔记为 Markdown">⬇ 导出</button>
        <button id="settings-btn" class="tbtn" title="设置">⚙</button>
      </div>
      <div id="titlebar-right">
        <button class="win-btn" id="min-btn">&#xE921;</button>
        <button class="win-btn" id="max-btn">&#xE922;</button>
        <button class="win-btn" id="close-btn">&#xE8BB;</button>
      </div>
    </div>

    <div id="app-container">
      <div class="view-container" id="view1-container" data-pane="1">
        <webview id="notebookView1" src="https://notebooklm.google.com/" partition="persist:notebooklm" preload="./webview-preload.js" allowpopups></webview>
        <div class="error-overlay" id="err1">
          <div class="err-title">无法连接 NotebookLM</div>
          <div class="err-body" id="err1-body">请检查网络连接，或稍后重试。</div>
          <div class="err-actions">
            <button class="primary" data-retry="notebookView1">重试</button>
            <button data-open-browser="1">在浏览器打开</button>
          </div>
        </div>
      </div>
      <div class="view-container hidden" id="view2-container" data-pane="2">
        <webview id="notebookView2" src="https://notebooklm.google.com/" partition="persist:notebooklm" preload="./webview-preload.js" allowpopups></webview>
        <div class="error-overlay" id="err2">
          <div class="err-title">无法连接 NotebookLM</div>
          <div class="err-body">请检查网络连接，或稍后重试。</div>
          <div class="err-actions">
            <button class="primary" data-retry="notebookView2">重试</button>
            <button data-open-browser="1">在浏览器打开</button>
          </div>
        </div>
      </div>
      <div class="view-container hidden" id="view3-container" data-pane="3">
        <webview id="notebookView3" src="https://notebooklm.google.com/" partition="persist:notebooklm" preload="./webview-preload.js" allowpopups></webview>
        <div class="error-overlay" id="err3">
          <div class="err-title">无法连接 NotebookLM</div>
          <div class="err-body">请检查网络连接，或稍后重试。</div>
          <div class="err-actions">
            <button class="primary" data-retry="notebookView3">重试</button>
            <button data-open-browser="1">在浏览器打开</button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="footer-side-left">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 11px;" title="开机时自动启动">
          <input type="checkbox" id="autoLaunchToggle" /> 开机自启
        </label>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 11px; margin-left: 14px;" title="点关闭按钮时隐藏到托盘而不是退出（需要托盘可用）">
          <input type="checkbox" id="closeToTrayToggle" /> 关闭时隐藏到托盘
        </label>
      </div>
    </footer>

    <!-- Settings modal -->
    <div class="modal-backdrop" id="settings-modal">
      <div class="modal">
        <h2>设置</h2>
        <div class="row">
          <label for="theme-select">主题</label>
          <select id="theme-select">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </div>
        <div class="row">
          <label>快速剪藏快捷键</label>
          <input type="text" class="hotkey-capture" id="hotkey-input" readonly placeholder="点击后按下组合键">
        </div>
        <div class="status-msg" id="hotkey-status"></div>
        <div class="row">
          <label for="always-on-top-cb">窗口置顶</label>
          <input type="checkbox" id="always-on-top-cb">
        </div>
        <div class="row">
          <label for="pane-count-select">启动时默认窗格数</label>
          <select id="pane-count-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
        <h2 style="margin-top: 14px;">代理</h2>
        <div class="row">
          <label for="proxy-mode-select">模式</label>
          <select id="proxy-mode-select">
            <option value="off">关闭（直连）</option>
            <option value="system">跟随系统</option>
            <option value="tunnel">内嵌隧道（vless/hysteria2 直连 VPS）</option>
            <option value="vps">直连代理（http/socks 地址）</option>
            <option value="mainland">智能分流（Google 走代理，其余直连）</option>
            <option value="manual">手动规则</option>
          </select>
        </div>
        <div class="row" id="proxy-server-row">
          <label for="proxy-server-input">代理服务器（http://用户:密码@主机:端口 或 socks5://）</label>
          <input type="text" id="proxy-server-input" placeholder="socks5://127.0.0.1:7890">
        </div>
        <div class="row" id="proxy-tunnel-row">
          <label for="proxy-tunnel-input">隧道 URI（vless://… 或 hysteria2://…）</label>
          <input type="password" id="proxy-tunnel-input" placeholder="vless://uuid@[2001:db8::1]:443?...">
        </div>
        <div class="row" id="proxy-rules-row">
          <label for="proxy-rules-input">Chromium 代理规则（手动模式）</label>
          <input type="text" id="proxy-rules-input" placeholder="[*.]google.com=socks5://127.0.0.1:7890">
        </div>
        <div class="status-msg" id="proxy-status"></div>
        <div class="footer-row">
          <button id="proxy-apply-btn">应用代理</button>
          <button id="proxy-check-btn">检测连通性</button>
        </div>
        <div class="footer-row">
          <button id="settings-close">关闭</button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
    <script>
      document.getElementById('min-btn').innerText = '—';
      document.getElementById('max-btn').innerText = '□';
      document.getElementById('close-btn').innerText = '✕';
    </script>
  </body>
</html>
